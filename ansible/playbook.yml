- name: Configure AWS EC2 Server for EKS CI/CD
  hosts: servers
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - ca-certificates
          - openjdk-17-jre
          - apt-transport-https
        state: present

    # =========================
    # DOCKER
    # =========================

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Create devops user
      user:
        name: devops
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true

    # =========================
    # AWS CLI
    # =========================

    - name: Download AWS CLI
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Extract AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/aws

    - name: Install AWS CLI
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

    # =========================
    # KUBECTL
    # =========================

    - name: Install kubectl
      shell: |
        KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)

        curl -L \
          "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
          -o /usr/local/bin/kubectl

        chmod +x /usr/local/bin/kubectl
      args:
        creates: /usr/local/bin/kubectl

    # =========================
    # EKSCTL
    # =========================

    - name: Install eksctl
      shell: |
        ARCH=amd64
        PLATFORM=$(uname -s)_$ARCH

        curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_${PLATFORM}.tar.gz"

        tar -xzf "eksctl_${PLATFORM}.tar.gz" -C /tmp

        mv /tmp/eksctl /usr/local/bin/eksctl

        chmod +x /usr/local/bin/eksctl

        rm -f "eksctl_${PLATFORM}.tar.gz"
      args:
        creates: /usr/local/bin/eksctl

    # =========================
    # HELM
    # =========================

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    # =========================
    # TRIVY
    # =========================

    - name: Install Trivy
      shell: |
        curl -sfL \
          https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
      args:
        creates: /usr/local/bin/trivy

    # =========================
    # VERIFICATION
    # =========================

    - name: Verify Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify AWS CLI
      command: aws --version
      register: aws_version
      changed_when: false

    - name: Verify kubectl
      command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Verify eksctl
      command: eksctl version
      register: eksctl_version
      changed_when: false

    - name: Verify Helm
      command: helm version
      register: helm_version
      changed_when: false

    - name: Verify Trivy
      command: trivy --version
      register: trivy_version
      changed_when: false

    - name: Configuration completed
      debug:
        msg:
          - "========================================"
          - "EKS CI/CD Server Setup Completed"
          - "========================================"
          - "{{ docker_version.stdout }}"
          - "{{ aws_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
          - "eksctl: {{ eksctl_version.stdout }}"
          - "{{ helm_version.stdout }}"
          - "{{ trivy_version.stdout }}"