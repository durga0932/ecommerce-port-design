- name: Configure AWS EC2 Server

  hosts: servers

  become: true

  tasks:

    - name: Update apt
      apt:
        update_cache: yes


    - name: Install common packages
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - ca-certificates
          - openjdk-17-jre
        state: present


    - name: Install Docker
      apt:
        name:
          - docker.io
        state: present


    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: true


    - name: Create devops user
      user:
        name: devops
        shell: /bin/bash
        create_home: true


    - name: Add devops to Docker group
      user:
        name: devops
        groups: docker
        append: true


    - name: Install kubectl
      shell: |
        KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
        curl -L \
        https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl \
        -o /usr/local/bin/kubectl
        chmod +x /usr/local/bin/kubectl
      args:
        creates: /usr/local/bin/kubectl


    - name: Install AWS CLI
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
        -o /tmp/awscliv2.zip

        unzip -o /tmp/awscliv2.zip -d /tmp

        /tmp/aws/install
      args:
        creates: /usr/local/bin/aws


    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm


    - name: Install Trivy
      shell: |
        curl -sfL \
        https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        | sh -s -- -b /usr/local/bin
      args:
        creates: /usr/local/bin/trivy


    - name: Verify Docker
      command: docker --version
      register: docker_version
      changed_when: false


    - name: Verify kubectl
      command: kubectl version --client
      register: kubectl_version
      changed_when: false


    - name: Verify Helm
      command: helm version
      register: helm_version
      changed_when: false


    - name: Verify Trivy
      command: trivy --version
      register: trivy_version
      changed_when: false


    - name: Configuration completed
      debug:
        msg:
          - "EC2 configuration completed"
          - "{{ docker_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
          - "{{ helm_version.stdout }}"
          - "{{ trivy_version.stdout }}"