
- name: Configure AWS EC2 Jenkins Agent

  hosts: all

  become: true

  vars:

    jenkins_user: jenkins

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install basic packages
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - ca-certificates
          - gnupg
          - apt-transport-https
          - openjdk-17-jre
        state: present


    # =========================================================
    # JENKINS USER
    # =========================================================

    - name: Create Jenkins user
      user:
        name: "{{ jenkins_user }}"
        shell: /bin/bash
        create_home: yes
        groups: sudo
        append: yes


    # =========================================================
    # DOCKER
    # =========================================================

    - name: Install Docker
      apt:
        name:
          - docker.io
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add Jenkins user to Docker group
      user:
        name: "{{ jenkins_user }}"
        groups: docker
        append: yes


    # =========================================================
    # GIT
    # =========================================================

    - name: Verify Git
      command: git --version
      register: git_version
      changed_when: false


    # =========================================================
    # DOCKER
    # =========================================================

    - name: Verify Docker
      command: docker --version
      register: docker_version
      changed_when: false


    # =========================================================
    # JAVA
    # =========================================================

    - name: Verify Java
      command: java -version
      register: java_version
      changed_when: false
      failed_when: false


    # =========================================================
    # JENKINS DIRECTORIES
    # =========================================================

    - name: Create Jenkins workspace
      file:
        path: /home/jenkins
        state: directory
        owner: "{{ jenkins_user }}"
        group: "{{ jenkins_user }}"
        mode: "0755"


    - name: Create Jenkins workspace directory
      file:
        path: /home/jenkins/workspace
        state: directory
        owner: "{{ jenkins_user }}"
        group: "{{ jenkins_user }}"
        mode: "0755"


    # =========================================================
    # KUBECTL
    # =========================================================

    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"


    - name: Verify kubectl
      command: kubectl version --client
      register: kubectl_version
      changed_when: false


    # =========================================================
    # AWS CLI
    # =========================================================

    - name: Download AWS CLI
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
        dest: /tmp/awscliv2.zip


    - name: Install unzip
      apt:
        name: unzip
        state: present


    - name: Extract AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes


    - name: Install AWS CLI
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws


    - name: Verify AWS CLI
      command: aws --version
      register: aws_version
      changed_when: false


    # =========================================================
    # JENKINS AGENT DIRECTORY
    # =========================================================

    - name: Set Jenkins directory ownership
      file:
        path: /home/jenkins
        owner: "{{ jenkins_user }}"
        group: "{{ jenkins_user }}"
        recurse: yes


    # =========================================================
    # SUMMARY
    # =========================================================

    - name: Show installed tools
      debug:
        msg:
          - "Jenkins Agent configuration completed"
          - "Docker: {{ docker_version.stdout }}"
          - "Git: {{ git_version.stdout }}"
          - "kubectl: {{ kubectl_version.stdout }}"
          - "AWS CLI: {{ aws_version.stdout }}"